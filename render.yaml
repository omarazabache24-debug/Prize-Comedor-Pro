services:
  - type: web
    name: comedor-apb-sac
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Lima
      - key: ENABLE_ADMIN_USER_ALERTS
        value: "0"
      - key: ADMIN_AUDIT_EMAIL
        value: omar.azabache24@gmail.com
